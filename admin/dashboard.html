<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Drogacenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>[v-cloak] { display: none; } body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="app" v-cloak class="flex min-h-screen">
        
        <aside class="w-64 bg-blue-900 text-white p-6 flex flex-col shadow-2xl">
            <div class="mb-10 text-center">
                <h1 class="text-xl font-black uppercase italic tracking-tighter">DROGA<span class="text-green-400">CENTER</span></h1>
                <p class="text-[9px] text-blue-300 font-bold uppercase mt-1">Olá, {{ adminSession?.user }}</p>
            </div>
            <nav class="space-y-2 flex-1 text-[10px] font-black uppercase tracking-widest">
                <button v-if="hasPermission('pedidos')" @click="view = 'orders'" :class="view === 'orders' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Pedidos</button>
                <button v-if="hasPermission('estoque')" @click="view = 'stock'" :class="view === 'stock' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Estoque</button>
                <button v-if="hasPermission('banners')" @click="view = 'banners'" :class="view === 'banners' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Banners</button>
                <button v-if="hasPermission('usuarios')" @click="view = 'users'" :class="view === 'users' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Usuários / Equipe</button>
            </nav>
            <button @click="logout" class="bg-red-500/20 text-red-400 p-3 rounded-xl font-black text-[10px] uppercase hover:bg-red-500 hover:text-white transition">Sair</button>
        </aside>

        <main class="flex-1 p-8">
            
            <div v-if="view === 'banners'" class="space-y-6 animate-fade-in">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-black text-blue-900 uppercase italic">Gerenciar Banners</h2>
                    <button @click="openBannerModal()" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase shadow-lg hover:bg-blue-700 transition-all">
                        + Adicionar Banner
                    </button>
                </div>

                <div v-if="banners.length === 0" class="bg-white p-20 rounded-3xl border-2 border-dashed text-center text-gray-400 font-bold uppercase text-xs">
                    Nenhum banner cadastrado para a tela inicial.
                </div>

                <div v-else class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div v-for="(b, idx) in banners" :key="idx" class="bg-white p-4 rounded-3xl border shadow-sm flex flex-col group relative">
                        <div class="h-40 overflow-hidden rounded-2xl bg-gray-100 mb-4 border">
                            <img :src="b.image" class="w-full h-full object-cover">
                        </div>
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="font-black text-blue-900 uppercase text-xs">{{ b.title }}</p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">{{ b.subtitle }}</p>
                            </div>
                            <span :class="b.active ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-500'" class="text-[8px] font-black uppercase px-2 py-1 rounded">
                                {{ b.active ? 'Ativo' : 'Pausado' }}
                            </span>
                        </div>
                        <div class="flex gap-2 mt-auto pt-4 border-t">
                            <button @click="toggleBannerStatus(idx)" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl text-[9px] font-black uppercase hover:bg-slate-200 transition">Alternar Status</button>
                            <button @click="deleteBanner(idx)" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl text-[9px] font-black uppercase hover:bg-red-500 hover:text-white transition">Remover</button>
                        </div>
                        <div class="absolute -top-2 -left-2 bg-blue-900 text-white w-6 h-6 flex items-center justify-center rounded-full text-[10px] font-bold shadow-md">
                            {{ b.order || (idx + 1) }}
                        </div>
                    </div>
                </div>
            </div>

            <div v-if="view === 'stock'">...</div>
            <div v-if="view === 'orders'">...</div>
            <div v-if="view === 'users'">...</div>

            <div v-if="showBannerModal" class="fixed inset-0 z-[300] flex items-center justify-center p-4">
                <div class="absolute inset-0 bg-blue-900/60 backdrop-blur-sm" @click="showBannerModal = false"></div>
                <div class="relative bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
                    <h3 class="text-xl font-black text-blue-900 uppercase mb-8 italic">Configurar Banner</h3>
                    <div class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-[9px] font-black uppercase text-slate-400 ml-2">Imagem do Banner (Local)</label>
                            <input type="file" @change="handleBannerUpload($event)" class="w-full bg-slate-100 p-4 rounded-2xl text-[10px] font-bold outline-none border-none">
                            <div v-if="bannerForm.image" class="mt-2 h-20 w-full overflow-hidden rounded-xl border-2 border-green-400">
                                <img :src="bannerForm.image" class="w-full h-full object-cover">
                            </div>
                        </div>
                        <input v-model="bannerForm.title" placeholder="Título (ex: Ofertas de Verão)" class="w-full bg-slate-100 p-4 rounded-2xl font-bold outline-none border-none text-xs">
                        <input v-model="bannerForm.subtitle" placeholder="Subtítulo (ex: 50% OFF em Vitaminas)" class="w-full bg-slate-100 p-4 rounded-2xl font-bold outline-none border-none text-xs">
                        <input v-model="bannerForm.order" type="number" placeholder="Ordem de exibição" class="w-full bg-slate-100 p-4 rounded-2xl font-bold outline-none border-none text-xs">
                        
                        <button @click="saveBanner" class="w-full bg-blue-900 text-white py-4 rounded-2xl font-black uppercase text-xs shadow-lg hover:bg-blue-800 transition-all mt-4">
                            Salvar e Publicar
                        </button>
                    </div>
                </div>
            </div>

            <div v-if="showModal && modalType === 'product'">...</div>

        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/admin.js"></script>
</body>
</html>
