<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Drogacenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>[v-cloak] { display: none; } body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50">
    <div id="app" v-cloak class="flex min-h-screen">
        <aside class="w-64 bg-blue-900 text-white p-6 flex flex-col shadow-2xl">
            <div class="mb-10 text-center">
                <h1 class="text-xl font-black uppercase italic">DROGA<span class="text-green-400">CENTER</span></h1>
                <p class="text-[9px] text-blue-300 font-bold uppercase mt-1">Olá, {{ adminSession?.user }}</p>
            </div>
            <nav class="space-y-2 flex-1 text-[10px] font-black uppercase tracking-widest">
                <button v-if="hasPermission('pedidos')" @click="view = 'orders'" :class="view === 'orders' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Pedidos</button>
                <button v-if="hasPermission('estoque')" @click="view = 'stock'" :class="view === 'stock' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Estoque</button>
                <button v-if="hasPermission('banners')" @click="view = 'banners'" :class="view === 'banners' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Banners</button>
                <button v-if="hasPermission('usuarios')" @click="view = 'users'" :class="view === 'users' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Usuários / Equipe</button>
            </nav>
            <button @click="logout" class="bg-red-500/20 text-red-400 p-3 rounded-xl font-black text-[10px] uppercase hover:bg-red-500 hover:text-white transition">Sair</button>
        </aside>

        <main class="flex-1 p-8">
            <div v-if="view === 'users'" class="space-y-6 animate-fade-in">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-black text-blue-900 uppercase italic">Gestão de Equipe</h2>
                    <button @click="openUserModal()" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase shadow-lg hover:bg-blue-700">+ Novo Acesso</button>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b text-[10px] font-black uppercase text-gray-400">
                            <tr><th class="p-4">Usuário</th><th class="p-4">Nível</th><th class="p-4">Permissões</th><th class="p-4 text-right">Ações</th></tr>
                        </thead>
                        <tbody class="text-xs font-bold uppercase">
                            <tr v-for="user in admins" :key="user.user" class="border-b last:border-0 hover:bg-slate-50 transition">
                                <td class="p-4 flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center">{{ user.user[0] }}</div>
                                    {{ user.user }}
                                </td>
                                <td class="p-4">
                                    <span :class="user.role.includes('master') ? 'text-purple-600' : 'text-blue-500'">{{ user.role }}</span>
                                </td>
                                <td class="p-4">
                                    <div class="flex flex-wrap gap-1">
                                        <span v-for="p in user.permissions" :key="p" class="bg-gray-100 px-2 py-0.5 rounded text-[8px]">{{ p }}</span>
                                    </div>
                                </td>
                                <td class="p-4 text-right">
                                    <button v-if="user.user !== 'Theo'" @click="editUser(user)" class="text-blue-600 mr-3 underline">Editar</button>
                                    <button v-if="canDelete(user)" @click="deleteUser(user.user)" class="text-red-500 underline">Excluir</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div v-if="view === 'orders'" class="space-y-6">
                <h2 class="text-2xl font-black text-blue-900 uppercase italic">Pedidos Recentes</h2>
                <div v-for="o in orders" :key="o.id" class="bg-white p-6 rounded-3xl border shadow-sm flex justify-between items-center mb-4">
                    <div>
                        <span class="text-[8px] font-black uppercase px-2 py-1 rounded bg-blue-100 text-blue-600">{{ o.status }}</span>
                        <h3 class="font-black text-blue-900 uppercase mt-2">{{ o.customer }}</h3>
                    </div>
                    <p class="text-xl font-black text-green-600">R$ {{ formatPrice(o.total) }}</p>
                </div>
            </div>

            <div v-if="view === 'stock'" class="space-y-6">
                <h2 class="text-2xl font-black text-blue-900 uppercase italic">Controle de Estoque</h2>
                </div>

            <div v-if="showUserModal" class="fixed inset-0 z-[300] flex items-center justify-center p-4">
                <div class="absolute inset-0 bg-blue-900/60 backdrop-blur-sm" @click="showUserModal = false"></div>
                <div class="relative bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
                    <h3 class="text-xl font-black text-blue-900 uppercase mb-8 italic">Configurar Acesso</h3>
                    <div class="space-y-4">
                        <input v-model="userForm.user" placeholder="Login" class="w-full bg-slate-100 p-4 rounded-2xl font-bold border-none outline-none" :disabled="userForm.isEdit">
                        <input v-model="userForm.pass" type="password" placeholder="Senha" class="w-full bg-slate-100 p-4 rounded-2xl font-bold border-none outline-none">
                        
                        <div v-if="adminSession.user === 'Theo'" class="flex gap-4 p-2 bg-gray-50 rounded-xl">
                            <label class="flex items-center gap-2 text-[10px] font-black uppercase cursor-pointer">
                                <input type="radio" v-model="userForm.role" value="subadmin"> Subadmin
                            </label>
                            <label class="flex items-center gap-2 text-[10px] font-black uppercase cursor-pointer">
                                <input type="radio" v-model="userForm.role" value="master_loja"> Master
                            </label>
                        </div>

                        <div class="space-y-2">
                            <p class="text-[9px] font-black uppercase text-slate-400 ml-2">Permissões de Acesso</p>
                            <div class="grid grid-cols-2 gap-2">
                                <label v-for="p in ['pedidos', 'estoque', 'banners', 'usuarios']" :key="p" class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg cursor-pointer hover:bg-slate-100 transition">
                                    <input type="checkbox" :value="p" v-model="userForm.permissions" :disabled="p === 'usuarios' && adminSession.user !== 'Theo'">
                                    <span class="text-[10px] font-bold uppercase">{{ p }}</span>
                                </label>
                            </div>
                        </div>

                        <button @click="saveUser" class="w-full bg-blue-900 text-white py-4 rounded-2xl font-black uppercase text-xs shadow-lg mt-4">Confirmar Dados</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/admin.js"></script>
</body>
</html>
