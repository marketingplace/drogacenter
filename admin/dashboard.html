<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Drogacenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>[v-cloak] { display: none; } body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50">
    <div id="app" v-cloak class="flex min-h-screen">
        <aside class="w-64 bg-blue-900 text-white p-6 flex flex-col shadow-2xl">
            <div class="mb-10 text-center">
                <h1 class="text-xl font-black uppercase italic">DROGA<span class="text-green-400">CENTER</span></h1>
                <p class="text-[9px] text-blue-300 font-bold uppercase mt-1">Gestão Cloud</p>
            </div>
            <nav class="space-y-2 flex-1 text-[10px] font-black uppercase tracking-widest">
                <button v-if="hasPermission('pedidos')" @click="view = 'orders'" :class="view === 'orders' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Pedidos</button>
                <button v-if="hasPermission('estoque')" @click="view = 'stock'" :class="view === 'stock' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Estoque</button>
                <button v-if="hasPermission('banners')" @click="view = 'banners'" :class="view === 'banners' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Banners</button>
                <button v-if="hasPermission('usuarios')" @click="view = 'users'" :class="view === 'users' ? 'bg-white/10 text-green-400 border-l-4 border-green-400' : ''" class="w-full text-left p-3 rounded-r-xl flex items-center gap-3 transition-all">Equipe</button>
            </nav>
            <button @click="logout" class="bg-red-500/20 text-red-400 p-3 rounded-xl font-black text-[10px] uppercase hover:bg-red-500 hover:text-white transition">Sair</button>
        </aside>

        <main class="flex-1 p-8">
            <div v-if="view === 'stock'" class="space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-black text-blue-900 uppercase italic">Controle de Estoque</h2>
                    <button id="btnAddProduct" @click="openProductModal" class="bg-green-600 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase shadow-lg hover:bg-green-700 transition-all cursor-pointer">
                        + Adicionar Produto
                    </button>
                </div>
                <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b text-[10px] font-black uppercase text-gray-400">
                            <tr><th class="p-4">Item</th><th class="p-4">Preço</th><th class="p-4">Qtd</th><th class="p-4 text-right">Ações</th></tr>
                        </thead>
                        <tbody class="text-xs font-bold uppercase text-slate-700">
                            <tr v-for="p in products" :key="p.id" class="border-b last:border-0 hover:bg-slate-50 transition">
                                <td class="p-4 flex items-center gap-3">
                                    <img :src="p.image || 'https://via.placeholder.com/50'" class="w-10 h-10 object-contain bg-white rounded-lg border p-1">
                                    {{ p.name }}
                                </td>
                                <td class="p-4">R$ {{ formatPrice(p.price) }}</td>
                                <td class="p-4">{{ p.qty }} un</td>
                                <td class="p-4 text-right">
                                    <button @click="editProduct(p)" class="text-blue-600 mr-3 underline">Editar</button>
                                    <button @click="deleteItem('dr_products', p.id)" class="text-red-500 underline">Excluir</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div v-if="view === 'orders'">...</div>
            <div v-if="view === 'banners'">...</div>
            <div v-if="view === 'users'">...</div>

            <div v-if="showModal && modalType === 'product'" class="fixed inset-0 z-[300] flex items-center justify-center p-4">
                <div class="absolute inset-0 bg-blue-900/60 backdrop-blur-sm" @click="showModal = false"></div>
                <div class="relative bg-white w-full max-w-2xl rounded-[2.5rem] p-10 shadow-2xl max-h-[90vh] overflow-y-auto">
                    <h3 class="text-xl font-black text-blue-900 uppercase mb-8 italic">{{ prodForm.id ? 'Editar' : 'Novo' }} Medicamento</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2 space-y-2">
                            <label class="text-[9px] font-black uppercase text-slate-400 ml-2">Foto (Upload Local)</label>
                            <input type="file" @change="handleUpload($event, 'prod')" class="w-full bg-slate-100 p-4 rounded-2xl text-[10px] font-bold border-none outline-none">
                            <img v-if="prodForm.image" :src="prodForm.image" class="h-20 w-20 object-contain rounded-lg border bg-white p-2 mt-2">
                        </div>
                        <input v-model="prodForm.name" placeholder="Nome do Produto" class="bg-slate-100 p-4 rounded-2xl font-bold outline-none border-none">
                        <input v-model="prodForm.price" type="number" placeholder="Preço (R$)" class="bg-slate-100 p-4 rounded-2xl font-bold outline-none border-none">
                        <input v-model="prodForm.category" placeholder="Categoria" class="bg-slate-100 p-4 rounded-2xl font-bold outline-none border-none">
                        <input v-model="prodForm.qty" type="number" placeholder="Estoque" class="bg-slate-100 p-4 rounded-2xl font-bold outline-none border-none">
                        <textarea v-model="prodForm.description" placeholder="Descrição/Detalhes" class="md:col-span-2 bg-slate-100 p-4 rounded-2xl font-bold h-32 border-none outline-none"></textarea>
                        <button @click="saveProduct" class="md:col-span-2 bg-blue-900 text-white py-4 rounded-2xl font-black uppercase text-xs shadow-lg hover:bg-blue-800 transition-all mt-4">
                            Salvar Alterações
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/admin.js"></script>
</body>
</html>
