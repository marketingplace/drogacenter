<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard | Drogacenter</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body class="bg-gray-100">

<div id="app" class="flex min-h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-blue-900 text-white p-6">
    <h1 class="font-black text-xl mb-8">DROGA<span class="text-green-400">CENTER</span></h1>

    <button @click="view='stock'" class="menu">Estoque</button>
    <button @click="view='banners'" class="menu">Banners</button>
    <button @click="view='users'" class="menu">Equipe</button>

    <button @click="logout" class="mt-10 text-red-400">Sair</button>
</aside>

<!-- CONTEÚDO -->
<main class="flex-1 p-8">

<!-- ESTOQUE -->
<section v-if="view==='stock'">
    <div class="flex justify-between mb-4">
        <h2 class="title">Estoque</h2>
        <button @click="openProduct()" class="btn-green">+ Produto</button>
    </div>

    <table class="w-full bg-white rounded">
        <tr v-for="p in products" :key="p.id">
            <td>{{ p.name }}</td>
            <td>R$ {{ p.price }}</td>
            <td>
                <button @click="editProduct(p)">⚙</button>
                <button @click="deleteProduct(p.id)">🗑</button>
            </td>
        </tr>
    </table>
</section>

<!-- BANNERS -->
<section v-if="view==='banners'">
    <div class="flex justify-between mb-4">
        <h2 class="title">Banners</h2>
        <button @click="openBanner()" class="btn-blue">+ Banner</button>
    </div>

    <div class="grid grid-cols-3 gap-4">
        <div v-for="b in banners" :key="b.id" class="bg-white p-2">
            <img :src="b.image" class="h-20 w-full object-cover">
            <button @click="deleteBanner(b.id)" class="text-red-500">Excluir</button>
        </div>
    </div>
</section>

<!-- MODAL -->
<div v-if="modal" class="fixed inset-0 bg-black/60 flex items-center justify-center">
    <div class="bg-white p-6 rounded w-96">
        <h3 class="font-black mb-4">
            {{ modalType === 'product' ? 'Produto' : 'Banner' }}
        </h3>

        <input v-if="modalType==='product'" v-model="form.name" placeholder="Nome" class="input">
        <input v-if="modalType==='product'" v-model="form.price" placeholder="Preço" type="number" class="input">
        <textarea v-if="modalType==='product'" v-model="form.description" placeholder="Descrição" class="input"></textarea>

        <input v-if="modalType==='banner'" v-model="form.title" placeholder="Título" class="input">

        <input type="file" @change="uploadImage">

        <button @click="save()" class="btn-green w-full mt-4">Salvar</button>
        <button @click="modal=false" class="w-full mt-2">Cancelar</button>
    </div>
</div>

</main>
</div>

<script src="admin.js"></script>
</body>
</html>
