<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Drogacenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        [v-cloak] { display: none; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" v-cloak class="flex min-h-screen">
        <aside class="w-64 bg-blue-900 text-white p-6 flex flex-col shadow-2xl">
            <div class="mb-10 text-center">
                <h1 class="text-xl font-black uppercase italic tracking-tighter">DROGA<span class="text-green-400">CENTER</span></h1>
                <p class="text-[9px] text-blue-300 font-bold uppercase mt-1">Olá, {{ adminSession?.user }}</p>
            </div>
            <nav class="space-y-2 flex-1 text-xs font-bold uppercase">
                <button @click="view = 'orders'" :class="view === 'orders' ? 'bg-white/10 text-green-400' : ''" class="w-full text-left p-3 rounded-xl flex items-center gap-3">Pedidos</button>
                <button @click="view = 'stock'" :class="view === 'stock' ? 'bg-white/10 text-green-400' : ''" class="w-full text-left p-3 rounded-xl flex items-center gap-3">Estoque</button>
                <button v-if="isAdmin" @click="view = 'users'" :class="view === 'users' ? 'bg-white/10 text-green-400' : ''" class="w-full text-left p-3 rounded-xl flex items-center gap-3">Equipe</button>
            </nav>
            <button @click="logout" class="bg-red-500/20 text-red-400 p-3 rounded-xl font-bold text-[10px] uppercase hover:bg-red-500 hover:text-white transition">Sair</button>
        </aside>

        <main class="flex-1 p-8">
            <div v-if="view === 'orders'" class="space-y-6">
                <h2 class="text-2xl font-black text-blue-900 uppercase italic">Pedidos em Tempo Real</h2>
                <div v-if="orders.length === 0" class="text-gray-400 font-bold">Nenhum pedido recebido.</div>
                <div v-for="order in orders" :key="order.id" class="bg-white p-6 rounded-3xl shadow-sm border flex justify-between items-center">
                    <div>
                        <span class="text-[8px] font-black uppercase px-2 py-1 rounded bg-blue-100 text-blue-600">{{ order.status }}</span>
                        <h3 class="font-black text-blue-900 uppercase mt-2">{{ order.customer }}</h3>
                        <p class="text-[10px] text-gray-400 font-bold">{{ order.date }}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-green-600 font-black text-xl">R$ {{ order.total }}</p>
                        <button @click="updateStatus(order.id, 'Concluído')" class="text-[9px] font-black text-blue-600 underline uppercase mt-2">Concluir</button>
                    </div>
                </div>
            </div>

            <div v-if="view === 'stock'" class="space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-black text-blue-900 uppercase italic">Controle de Estoque</h2>
                    <button @click="openModal" class="bg-green-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">+ Adicionar</button>
                </div>
                <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left text-xs uppercase font-bold">
                        <thead class="bg-gray-50 border-b text-gray-400">
                            <tr><th class="p-4">Produto</th><th class="p-4">Qtd</th><th class="p-4">Preço</th><th class="p-4 text-right">Ações</th></tr>
                        </thead>
                        <tbody>
                            <tr v-for="p in products" :key="p.id" class="border-b last:border-0">
                                <td class="p-4">{{ p.name }}</td>
                                <td class="p-4">{{ p.qty }} un</td>
                                <td class="p-4">R$ {{ p.price }}</td>
                                <td class="p-4 text-right">
                                    <button @click="deleteProduct(p.id)" class="text-red-500">Excluir</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div v-if="showModal" class="fixed inset-0 z-[300] flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-blue-900/60 backdrop-blur-sm" @click="showModal = false"></div>
            <div class="relative bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
                <h3 class="text-lg font-black text-blue-900 uppercase mb-6 italic">Novo Produto</h3>
                <div class="space-y-4">
                    <input v-model="prodForm.name" placeholder="Nome do Produto" class="w-full bg-gray-100 p-4 rounded-xl font-bold outline-none">
                    <input v-model="prodForm.price" type="number" placeholder="Preço (R$)" class="w-full bg-gray-100 p-4 rounded-xl font-bold outline-none">
                    <input v-model="prodForm.qty" type="number" placeholder="Quantidade" class="w-full bg-gray-100 p-4 rounded-xl font-bold outline-none">
                    <button @click="saveProduct" class="w-full bg-blue-900 text-white py-4 rounded-xl font-black uppercase text-xs">Salvar Estoque</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="assets/admin.js"></script>
</body>
</html>
