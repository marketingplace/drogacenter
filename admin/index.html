<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return { user: '', pass: '' }
        },
        methods: {
            handleLogin() {
                let admins = JSON.parse(localStorage.getItem('dr_admins')) || [];
                
                // CRIAÇÃO DOS MASTER ADMINS (Caso não existam)
                const masters = [
                    {user: 'Charles', pass: 'Patrão', role: 'master_loja'},
                    {user: 'Theo', pass: 'Gh050819', role: 'master_sistema'}
                ];

                masters.forEach(m => {
                    if (!admins.find(a => a.user === m.user)) {
                        admins.push(m);
                    }
                });
                localStorage.setItem('dr_admins', JSON.stringify(admins));

                const found = admins.find(a => a.user === this.user && a.pass === this.pass);
                if(found) {
                    // Salvamos a sessão e o nível de acesso
                    sessionStorage.setItem('dr_logged_admin', JSON.stringify(found));
                    window.location.href = 'dashboard.html';
                } else {
                    alert("Usuário ou senha incorretos!");
                }
            }
        }
    }).mount('#app');
</script>
